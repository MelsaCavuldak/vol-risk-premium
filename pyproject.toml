[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-risk-premium"
version = "0.2.0"
description = "Volatility risk premium on the S&P 500: forecasting and a delta-hedged short straddle backtest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "arch>=6.2",
    "yfinance>=0.2.40",
    "duckdb>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
notebooks = ["jupyterlab>=4"]

[tool.setuptools]
packages = ["vrp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
